<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 航空驾驶</title>
    <link rel="stylesheet" href="flight.css?v=two-airport-20260825" />
  </head>
  <body>
    <main class="flight-shell">
      <section class="sim">
        <canvas id="flightCanvas" aria-label="3D 航空驾驶游戏"></canvas>
        <a class="home-link" href="arcade.html">游戏大厅</a>
        <div class="hud">
          <p>3D Flight Simulator</p>
          <h1>3D 航空驾驶</h1>
          <span id="statusText">飞机一开始就在跑道上准备起飞。右边油门往前更快，往后减速；起落架拉杆左 Down、右 Up。</span>
        </div>
        <div class="route-label" id="routeLabel">绿色灯线：起飞跑道</div>
        <div class="mobile-yoke" id="mobileYoke" aria-label="手机操纵杆">
          <span id="mobileKnob"></span>
        </div>
      </section>

      <aside class="cockpit">
        <section class="panel status">
          <p class="label">驾驶仪表</p>
          <h2 id="missionTitle">跑道起飞准备</h2>
          <div class="metrics">
            <div><span>速度</span><strong id="speedText">0 kt</strong></div>
            <div><span>高度</span><strong id="altitudeText">0 m</strong></div>
            <div><span>起落架</span><strong id="gearText">Down</strong></div>
            <div><span>航班</span><strong id="airlineText">南航</strong></div>
          </div>
        </section>

        <section class="panel levers">
          <div class="throttle-box">
            <p class="label">右侧油门杆</p>
            <input id="throttleLever" type="range" min="-30" max="100" value="0" orient="vertical" />
            <div class="lever-tags"><span>快</span><span>慢</span><span>反向/停</span></div>
          </div>
          <div class="gear-box">
            <p class="label">起落架</p>
            <input id="gearLever" type="range" min="0" max="100" value="0" />
            <div class="gear-tags"><span>Down</span><span>Up</span></div>
          </div>
          <div class="yoke-box">
            <p class="label">飞机操纵杆</p>
            <div class="yoke" id="yoke"><span id="yokeKnob"></span></div>
            <small>上推下降，下拉上升，左右转向。</small>
          </div>
        </section>

        <section class="panel buttons">
          <button id="taxiBtn" type="button">跑道灯线</button>
          <button id="takeoffBtn" type="button">起飞</button>
          <button id="landingBtn" type="button">降落导航</button>
          <button id="brakeBtn" type="button">刹车停下</button>
          <button id="cameraBtn" type="button">切换视角</button>
          <button id="resetBtn" type="button">重来</button>
        </section>

        <section class="panel airline-panel">
          <p class="label">选择航空公司</p>
          <div id="airlineButtons" class="airline-buttons"></div>
        </section>

        <section class="panel log-panel">
          <p class="label">飞行记录</p>
          <ol id="flightLog"></ol>
        </section>
      </aside>
    </main>

    <script type="module" src="flight.js?v=two-airport-20260825"></script>
    <script src="arcade-stats.js?v=visitor-table-20260728"></script>
  </body>
</html>
