<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大九九乘法过关</title>
    <link rel="stylesheet" href="big-multiplication.css?v=bluegreen-bg-20260829" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="close-link" href="arcade.html" aria-label="返回游戏大厅">×</a>
        <div>
          <h1>大九九乘法过关</h1>
          <p>蓝绿色乘法练习</p>
        </div>
        <div class="mode-toggle" aria-label="计时模式">
          <button id="timerModeBtn" class="active" type="button">计时</button>
          <button id="noTimerModeBtn" type="button">不计时</button>
        </div>
        <button id="recordTopBtn" class="outline-btn" type="button">学习记录</button>
      </header>

      <section id="homeScreen" class="screen active">
        <div class="page-head">
          <h2>关卡列表</h2>
          <div class="summary-grid">
            <article>
              <span>已完成</span>
              <strong id="completedDays">0 天</strong>
            </article>
            <article>
              <span>平均正确率</span>
              <strong id="averageRate">0%</strong>
            </article>
          </div>
        </div>
        <section id="wrongPracticeHome" class="wrong-practice-home" aria-label="错题专项练习"></section>
        <div id="levelList" class="level-list"></div>
      </section>

      <section id="quizScreen" class="screen">
        <div class="quiz-head">
          <button id="backHomeBtn" class="ghost-btn" type="button">返回首页</button>
          <div>
            <p class="label" id="quizMeta">Day 1</p>
            <h2 id="quizTitle">11 的乘法表专项训练</h2>
          </div>
          <div id="timerBox" class="timer-box">不限时</div>
        </div>

        <div class="progress-wrap" aria-label="答题进度">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="quiz-grid">
          <section class="question-card">
            <p id="questionType" class="question-type">基础计算</p>
            <h3 id="questionText">11 × 11 = ?</h3>
            <form id="answerForm" class="answer-form">
              <input id="answerInput" inputmode="numeric" autocomplete="off" placeholder="输入答案" aria-label="输入答案" />
              <button type="submit">下一题</button>
            </form>
            <button id="hintToggle" class="hint-toggle" type="button">展开记忆提示</button>
            <div id="hintPanel" class="hint-panel"></div>
            <p id="feedbackText" class="feedback-text"></p>
          </section>

          <aside class="done-card">
            <div class="done-head">
              <p class="label">Done</p>
              <strong id="doneCount">0/20</strong>
            </div>
            <div id="doneList" class="done-list"></div>
          </aside>
        </div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-card">
          <p id="resultBadge" class="result-badge">未通过</p>
          <h2 id="resultTitle">本关成绩</h2>
          <div class="result-stats">
            <article>
              <span>总题数</span>
              <strong id="resultTotal">20</strong>
            </article>
            <article>
              <span>正确数</span>
              <strong id="resultCorrect">0</strong>
            </article>
            <article>
              <span>正确率</span>
              <strong id="resultRate">0%</strong>
            </article>
          </div>
          <h3>错题列表</h3>
          <div id="wrongList" class="wrong-list"></div>
          <p id="resultNextHint" class="result-next-hint"></p>
          <div class="result-actions">
            <button id="nextLevelBtn" type="button">下一关</button>
            <button id="drillWrongBtn" type="button">继续练错题</button>
            <button id="retryBtn" type="button">重新挑战</button>
            <button id="resultHomeBtn" type="button">返回首页</button>
          </div>
        </div>
      </section>

      <section id="recordScreen" class="screen">
        <div class="page-head records-head">
          <h2>学习记录</h2>
          <button id="exitRecordBtn" class="outline-btn" type="button">退出</button>
        </div>
        <div class="record-summary">
          <article>
            <span>完成天数</span>
            <strong id="recordCompleted">0</strong>
          </article>
          <article>
            <span>平均正确率</span>
            <strong id="recordAverage">0%</strong>
          </article>
          <article>
            <span>总尝试次数</span>
            <strong id="recordAttempts">0</strong>
          </article>
        </div>
        <div class="tab-row">
          <button id="historyTab" class="active" type="button">历史记录</button>
          <button id="wrongTab" type="button">错题本</button>
        </div>
        <div id="historyPanel" class="record-panel active"></div>
        <div id="wrongPanel" class="record-panel"></div>
      </section>

      <footer class="developer-badge" aria-label="开发者">
        <img src="assets/developer-kimi-avatar.jpg" alt="kimi王佑奇头像" class="developer-avatar" />
        <span>开发者：kimi王佑奇</span>
      </footer>

      <nav class="bottom-nav" aria-label="底部导航栏">
        <button id="levelsNav" class="active" type="button">
          <span>⚗</span>
          关卡
        </button>
        <button id="recordsNav" type="button">
          <span>↺</span>
          记录
        </button>
      </nav>
    </main>
    <script src="big-multiplication.js?v=bluegreen-bg-20260829"></script>
    <script src="arcade-stats.js?v=visitor-table-20260728"></script>
  </body>
</html>
