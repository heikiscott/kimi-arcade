<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛋仔派对 3D 机场</title>
    <link rel="stylesheet" href="eggy-3d.css?v=boarding-platform-20260714" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="page">
      <section class="stage">
        <canvas id="threeCanvas" aria-label="蛋仔派对 3D 机场"></canvas>
        <div class="hud">
          <strong id="placeName">3D 国际机场</strong>
          <span id="flightState">走到飞机旁边，点“上飞机”。</span>
        </div>
        <div class="stick" id="moveStick" aria-label="移动摇杆">
          <span id="moveKnob"></span>
        </div>
        <div class="screen-actions" aria-label="屏幕操作按钮">
          <button id="screenWalkBtn" type="button">走</button>
          <button id="screenJumpBtn" type="button">跳</button>
          <button id="screenBallBtn" type="button">变滚球</button>
          <button id="screenExpressionBtn" type="button">表情</button>
        </div>
      </section>
      <section class="controls">
        <div class="panel-title">
          <p>Eggy Party 3D</p>
          <h1>立体乐园</h1>
        </div>
        <label>
          地点
          <select id="placeSelect">
            <option value="airport">机场</option>
            <option value="amusement">游乐园</option>
            <option value="challenge">闯关游戏</option>
            <option value="water">水上乐园</option>
            <option value="metro">地铁站</option>
          </select>
        </label>
        <label>
          机场风格
          <select id="styleSelect">
            <option value="china">中国风格</option>
            <option value="usa">美国风格</option>
            <option value="uk">英国风格</option>
            <option value="egypt">埃及风格</option>
            <option value="southAfrica">南非风格</option>
            <option value="japan">日本风格</option>
            <option value="germany">德国风格</option>
            <option value="thailand">泰国风格</option>
            <option value="france">法国风格</option>
            <option value="uae">阿联酋风格</option>
            <option value="australia">澳大利亚风格</option>
            <option value="korea">韩国风格</option>
            <option value="india">印度风格</option>
            <option value="brazil">巴西风格</option>
            <option value="canada">加拿大风格</option>
          </select>
        </label>
        <label>
          机场地点
          <select id="airportSelect"></select>
        </label>
        <div class="button-grid">
          <button id="startBtn" type="button">开始/互动</button>
          <button id="parkBtn" type="button">乐园</button>
          <button id="lobbyBtn" type="button">回大厅</button>
          <button id="tourBtn" type="button">环游世界</button>
          <button id="ferrisBtn" type="button">上摩天轮</button>
          <button id="accidentRideBtn" type="button">飞机事故体验</button>
          <button id="selectPlaneBtn" type="button">换飞机</button>
          <button id="boardBtn" type="button">上飞机</button>
          <button id="cockpitBtn" type="button">驾驶室</button>
          <button id="cabinWalkBtn" type="button">客舱走动</button>
          <button id="deckBtn" type="button">上二楼</button>
          <button id="taxiBtn" type="button">竖向滑行</button>
          <button id="takeoffBtn" type="button">跑道起飞</button>
          <button id="metroRideBtn" type="button">开地铁</button>
          <button id="landBtn" type="button">降落</button>
          <button id="exitBtn" type="button">下飞机</button>
          <button id="resetBtn" type="button">重来</button>
          <button id="walkBtn" type="button">走</button>
          <button id="jumpBtn" type="button">跳</button>
          <button id="ballBtn" type="button">变滚球</button>
          <button id="expressionBtn" type="button">表情</button>
          <button id="classScoreBtn" type="button">全班加分</button>
          <button id="meScoreBtn" type="button">给我加分</button>
        </div>
        <div class="score-board" aria-label="同学积分">
          <strong>同学积分</strong>
          <div id="studentScores"></div>
        </div>
        <p class="hint">飞机在空中时，左下角圆杆就是飞机操纵杆：往下拉上升，往上推下降，左拉左飞，右拉右飞。飞够 300000 米会到下一个国家机场。</p>
      </section>
    </main>
    <script type="module" src="eggy-3d.js?v=boarding-platform-20260714"></script>
  </body>
</html>
