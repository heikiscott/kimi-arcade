<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛋仔派对 3D 机场</title>
    <link rel="stylesheet" href="eggy-3d.css" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="page">
      <section class="stage">
        <canvas id="threeCanvas" aria-label="蛋仔派对 3D 机场"></canvas>
        <div class="hud">
          <strong id="placeName">3D 国际机场</strong>
          <span id="flightState">走到飞机旁边，点“上飞机”。</span>
        </div>
        <div class="stick" id="moveStick" aria-label="移动摇杆">
          <span id="moveKnob"></span>
        </div>
      </section>
      <section class="controls">
        <div class="panel-title">
          <p>Eggy Party 3D</p>
          <h1>立体乐园</h1>
        </div>
        <label>
          地点
          <select id="placeSelect">
            <option value="airport">机场</option>
            <option value="amusement">游乐园</option>
            <option value="water">水上乐园</option>
            <option value="metro">地铁站</option>
          </select>
        </label>
        <label>
          机场风格
          <select id="styleSelect">
            <option value="china">中国风格</option>
            <option value="usa">美国风格</option>
            <option value="uk">英国风格</option>
            <option value="egypt">埃及风格</option>
            <option value="southAfrica">南非风格</option>
            <option value="japan">日本风格</option>
          </select>
        </label>
        <div class="button-grid">
          <button id="boardBtn" type="button">上飞机</button>
          <button id="taxiBtn" type="button">竖向滑行</button>
          <button id="takeoffBtn" type="button">跑道起飞</button>
          <button id="landBtn" type="button">降落</button>
          <button id="exitBtn" type="button">下飞机</button>
          <button id="resetBtn" type="button">重来</button>
          <button id="classScoreBtn" type="button">全班加分</button>
          <button id="meScoreBtn" type="button">给我加分</button>
        </div>
        <div class="score-board" aria-label="同学积分">
          <strong>同学积分</strong>
          <div id="studentScores"></div>
        </div>
        <p class="hint">先选地点。机场里才会出现飞机和跑道；游乐园、水上乐园、地铁站会单独显示自己的场景。</p>
      </section>
    </main>
    <script type="module" src="eggy-3d.js"></script>
  </body>
</html>
