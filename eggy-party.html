<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛋仔派对闯关</title>
    <link rel="stylesheet" href="eggy-party.css?v=challenge-racing-music-20260727" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="eggy-shell">
      <section class="game-stage">
        <canvas id="gameCanvas" width="1040" height="620" aria-label="蛋仔派对闯关小游戏"></canvas>
        <div class="screen-stick" aria-label="屏幕左下角飞机操纵杆">
          <div class="joystick" id="flightStick" role="application" aria-label="圆形飞机操纵杆">
            <span id="flightKnob"></span>
          </div>
          <small>飞机操纵杆</small>
        </div>
        <div class="status-bar" id="statusText">这是蛋仔派对大厅。点“地图”选哪里，画面场景就到哪里。</div>
      </section>

      <section class="control-panel">
        <p class="label">Eggy Party</p>
        <h1>蛋仔派对</h1>
        <div class="score-grid">
          <div><span>地图</span><strong id="levelText">派对大厅</strong></div>
          <div><span>星星</span><strong id="starText">0</strong></div>
          <div><span>时间</span><strong id="timeText">0.0</strong></div>
        </div>
        <label class="character-control" for="characterSelect">
          <span>选择蛋仔角色</span>
          <select id="characterSelect">
            <option value="0">黄色蛋仔</option>
            <option value="1">粉色蛋仔</option>
            <option value="2">蓝色蛋仔</option>
            <option value="3">紫色蛋仔</option>
            <option value="4">绿色蛋仔</option>
            <option value="5">飞行员蛋仔</option>
            <option value="6">星星蛋仔</option>
            <option value="7">小熊蛋仔</option>
          </select>
        </label>
        <div class="button-row">
          <button id="startBtn" type="button">开始/互动</button>
          <button id="restartBtn" type="button">重来</button>
          <button id="parkBtn" type="button">地图</button>
          <button id="lobbyBtn" type="button">回大厅</button>
          <button id="threeDBtn" type="button" onclick="location.href='eggy-3d.html'">3D版</button>
        </div>
        <div class="location-picker" id="locationPicker" hidden>
          <div class="picker-head">
            <strong>选择地图地点</strong>
            <button id="closePickerBtn" type="button">关闭</button>
          </div>
          <div class="category-row" id="categoryRow"></div>
          <div class="location-list" id="locationList"></div>
        </div>
        <div class="flight-controls" id="flightControls" aria-label="飞机控制台" hidden>
          <label class="destination-control" for="destinationAirportSelect">
            <span>目的地机场</span>
            <select id="destinationAirportSelect"></select>
          </label>
          <button id="boardFlightBtn" type="button">上飞机</button>
          <button id="runwayFlightBtn" type="button">去起飞跑道</button>
          <button id="landingRunwayFlightBtn" type="button">去降落跑道</button>
          <button id="taxiFlightBtn" type="button">滑行</button>
          <button id="accelFlightBtn" type="button">加速</button>
          <button id="decelFlightBtn" type="button">减速</button>
          <button id="takeoffBtn" type="button">起飞</button>
          <button id="landingBtn" type="button">降落</button>
          <button id="smoothFlightBtn" type="button">平稳飞行</button>
          <button id="exitFlightBtn" type="button">下飞机</button>
          <button id="jumpFlightBtn" type="button">跳下飞机</button>
          <button id="ballModeBtn" type="button">变球滚</button>
          <button id="crashSongBtn" type="button">空难之歌</button>
          <p>先选目的地机场，再上飞机；飞离原机场 300000 米后，就会到另一个国家的机场。</p>
        </div>
        <div class="challenge-controls" id="challengeControls" aria-label="闯关控制台" hidden>
          <button type="button" data-control="left">左走</button>
          <button type="button" data-control="right">走</button>
          <button type="button" data-control="jump">跳</button>
          <button type="button" data-control="roll">冲刺</button>
          <button type="button" data-control="block">脚下方块</button>
          <button id="playCourseMusicBtn" type="button">播放闯关音乐</button>
          <button id="chooseMusicBtn" type="button">选择本地音乐</button>
          <input id="localMusicInput" type="file" accept="audio/*,video/mp4,video/*" hidden />
          <p>闯关在天空上：按“跳/上键”飞上去，按“冲刺/下键”压下来，点“脚下方块”可以在空中垫路。默认播放 3D 天空竞速赛车音乐，也可以选择自己电脑里的音乐。</p>
        </div>
        <p class="hint">点“地图”选哪里，场景就切到哪里。机场里先走到飞机旁边，再点“上飞机”“去起飞跑道”或“去降落跑道”。</p>
      </section>
    </main>
    <script src="eggy-party.js?v=challenge-racing-music-20260727"></script>
    <script src="arcade-stats.js?v=global-records-20260727"></script>
  </body>
</html>
