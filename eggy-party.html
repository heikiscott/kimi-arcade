<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蛋仔派对闯关</title>
    <link rel="stylesheet" href="eggy-party.css" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="eggy-shell">
      <section class="game-stage">
        <canvas id="gameCanvas" width="1040" height="620" aria-label="蛋仔派对闯关小游戏"></canvas>
        <div class="status-bar" id="statusText">点开始，控制蛋仔冲到皇冠终点。</div>
      </section>

      <section class="control-panel">
        <p class="label">Eggy Party</p>
        <h1>蛋仔派对闯关</h1>
        <div class="score-grid">
          <div><span>关卡</span><strong id="levelText">彩虹跑道</strong></div>
          <div><span>星星</span><strong id="starText">0</strong></div>
          <div><span>时间</span><strong id="timeText">0.0</strong></div>
        </div>
        <div class="button-row">
          <button id="startBtn" type="button">开始</button>
          <button id="restartBtn" type="button">重来</button>
        </div>
        <div class="mobile-pad" aria-label="手机控制">
          <button data-control="left" type="button">左</button>
          <button data-control="jump" type="button">跳</button>
          <button data-control="right" type="button">右</button>
          <button data-control="roll" type="button">冲刺</button>
        </div>
        <p class="hint">键盘：A/← 左走，D/→ 右走，W/↑/空格跳，S/↓ 冲刺滚。别被旋转锤撞下去。</p>
      </section>
    </main>
    <script src="eggy-party.js"></script>
  </body>
</html>
