<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绿野仙踪短片演示</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #172632;
        background:
          linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.88)),
          linear-gradient(135deg, #b9e8ff, #fff4c8 48%, #c7f2d5);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(960px, 100%);
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      a {
        color: inherit;
        font-weight: 900;
      }

      .home {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 14px;
        border: 2px solid rgba(23, 38, 50, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        text-decoration: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.8rem);
        letter-spacing: 0;
      }

      .movie {
        overflow: hidden;
        border: 4px solid #172632;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 18px 34px rgba(23, 38, 50, 0.16);
      }

      .movie img {
        display: block;
        width: 100%;
        height: auto;
      }

      .note {
        margin: 14px 0 0;
        padding: 14px 16px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        font-size: 1rem;
        font-weight: 800;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>绿野仙踪短片演示</h1>
        <a class="home" href="index.html">游戏大厅</a>
      </div>

      <section class="movie" aria-label="绿野仙踪短片演示动图">
        <img src="oz-movie-demo.gif?v=20260717" alt="绿野仙踪短片演示" />
      </section>

      <p class="note">
        发微信时请发这个网页链接，不要转发本地文件或临时图片。别人点开网页就能看到短片演示。
      </p>
    </main>
  </body>
</html>
