<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>马里奥游戏 · 参考音乐新版</title>
    <link rel="stylesheet" href="mario.css?v=powerups-save-20260727" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <div class="sound-controls">
      <button class="sound-toggle" id="soundToggleBtn" type="button" aria-pressed="false">音效开</button>
      <button class="music-import" id="musicImportBtn" type="button">换音乐</button>
      <input id="musicImportInput" type="file" accept="audio/*" hidden />
    </div>
    <main class="mario-shell">
      <section class="game-wrap">
        <div class="canvas-wrap">
          <canvas id="game" width="1060" height="620" aria-label="原创马里奥横版跳跃游戏"></canvas>
          <div class="intro-overlay" id="introOverlay">
            <p>Original Platform Adventure</p>
            <h1>马里奥游戏</h1>
            <span id="introStatus">先选一个地方：长关卡、机关、星星和地铁都有</span>
            <div class="map-select" aria-label="选择地图">
              <button class="active" data-map="sky" type="button">天空</button>
              <button data-map="ghost" type="button">鬼屋</button>
              <button data-map="castle" type="button">城堡</button>
              <button data-map="jungle" type="button">丛林</button>
              <button data-map="lava" type="button">岩浆</button>
              <button data-map="mine" type="button">宝石矿洞</button>
              <button data-map="metro" type="button">坐地铁</button>
            </div>
            <div class="save-actions">
              <button id="continueSaveBtn" type="button" hidden>继续上次游戏</button>
              <button id="startIntroBtn" type="button">开始冒险</button>
            </div>
          </div>
          <div class="touch-pad" aria-label="手机控制按钮">
            <div class="touch-stick" aria-label="左右方向虚拟摇杆">
              <button class="touch-arrow" data-control="left" type="button" aria-label="向左移动">左</button>
              <button class="touch-arrow" data-control="right" type="button" aria-label="向右移动">右</button>
            </div>
            <div class="touch-extra" aria-label="机关按钮">
              <button data-control="door" type="button">进/出</button>
              <button data-control="elevator" type="button">电梯</button>
              <button data-control="fire" type="button">火</button>
            </div>
            <button class="touch-jump" data-control="jump" type="button" aria-label="跳跃">跳</button>
          </div>
        </div>
        <div class="hud">
          <strong id="score">金币 0 / 0</strong>
          <span id="statusText">先点开始冒险。A/D 移动，空格跳，J 发火球，E 或 ↓ 进门，S 电梯，顶砖有隐藏机关。</span>
          <button id="recordsBtn" type="button">大厅记录</button>
          <button id="restartBtn" type="button">重来</button>
        </div>
        <div class="records-panel" id="recordsPanel" hidden>
          <strong>小游戏大厅访问记录</strong>
          <span id="recordsText">还没有记录。</span>
        </div>
      </section>
    </main>
    <script src="arcade-stats.js?v=global-records-20260727"></script>
    <script src="mario.js?v=powerups-save-20260727"></script>
  </body>
</html>
