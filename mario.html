<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>马聊冒险 · 鬼屋城堡新版</title>
    <link rel="stylesheet" href="mario.css?v=mario-powerups-20260727" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="mario-shell">
      <section class="game-wrap">
        <div class="canvas-wrap">
          <canvas id="game" width="1060" height="620" aria-label="原创马聊冒险跳跃游戏"></canvas>
          <div class="intro-overlay" id="introOverlay">
            <p>Original Platform Adventure</p>
            <h1>马聊冒险</h1>
            <span id="introStatus">新版：隐藏机关、问号砖、星星无敌、变大、鬼屋城堡</span>
            <button id="startIntroBtn" type="button">开始冒险</button>
          </div>
          <div class="touch-pad" aria-label="手机控制按钮">
            <button data-control="left" type="button">左</button>
            <button data-control="right" type="button">右</button>
            <button data-control="jump" type="button">跳</button>
            <button data-control="door" type="button">进/出</button>
            <button data-control="elevator" type="button">电梯</button>
          </div>
        </div>
        <div class="hud">
          <strong id="score">金币 0 / 0</strong>
          <span id="statusText">先点开始冒险。A/D 移动，空格跳，E 或 ↓ 进门，S 电梯，顶砖有隐藏机关。</span>
          <button id="restartBtn" type="button">重来</button>
        </div>
      </section>
    </main>
    <script src="mario.js?v=mario-powerups-20260727"></script>
  </body>
</html>
