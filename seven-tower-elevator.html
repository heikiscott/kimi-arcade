<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>埃菲尔铁塔七部电梯</title>
    <link rel="stylesheet" href="seven-tower-elevator.css?v=eiffel-platform-big-20260730" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>

    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="label">2D Elevator Simulator</p>
          <h1>埃菲尔铁塔电梯系统</h1>
          <p>四根斜柱分别是两部黄色双层客梯、一部红色货梯和一条楼梯；客梯到一、二、三层平台，货梯直达二层餐厅，再换中间竖直电梯去四层和顶端公寓。</p>
        </div>
      </header>

      <section class="tower-stage" id="towerStage" aria-label="埃菲尔铁塔七部电梯运行画面">
        <div class="sun"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="paris-backdrop" aria-hidden="true">
          <span class="river"></span>
          <span class="city-block block-a"></span>
          <span class="city-block block-b"></span>
          <span class="city-block block-c"></span>
          <span class="tree tree-a"></span>
          <span class="tree tree-b"></span>
          <span class="tree tree-c"></span>
        </div>

        <div class="eiffel-frame" aria-hidden="true">
          <svg class="eiffel-svg" viewBox="0 0 1000 700" role="img" aria-label="埃菲尔铁塔二维钢架">
            <defs>
              <linearGradient id="ironGradient" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#d7c7b6" />
                <stop offset="0.52" stop-color="#8e7562" />
                <stop offset="1" stop-color="#463930" />
              </linearGradient>
              <clipPath id="towerClip">
                <path d="M486 34 L514 34 L610 248 L772 670 L628 670 L545 372 L455 372 L372 670 L228 670 L390 248 Z" />
              </clipPath>
            </defs>

            <path class="svg-antenna" d="M500 0 L500 44" />
            <path class="svg-spire" d="M486 34 L514 34 L534 115 L466 115 Z" />
            <g class="svg-tower-fill" clip-path="url(#towerClip)">
              <rect x="190" y="32" width="620" height="642" fill="url(#ironGradient)" opacity="0.32" />
              <path d="M230 670 L500 34 L770 670" />
              <path d="M360 670 L500 34 L640 670" />
              <path d="M230 670 L770 670" />
              <path d="M285 525 L715 525 M330 410 L670 410 M390 248 L610 248 M455 115 L545 115" />
              <path d="M240 650 L720 530 L318 420 L620 248 L468 116" />
              <path d="M760 650 L280 530 L682 420 L380 248 L532 116" />
              <path d="M270 610 L707 462 M730 610 L293 462 M330 500 L648 330 M670 500 L352 330" />
              <path d="M393 246 L230 670 M607 246 L770 670" />
            </g>
            <g class="svg-heavy">
              <path d="M228 670 C322 466 386 250 486 34" />
              <path d="M772 670 C678 466 614 250 514 34" />
              <path d="M372 670 C424 466 456 250 486 34" />
              <path d="M628 670 C576 466 544 250 514 34" />
            </g>
            <g class="svg-decks">
              <rect x="424" y="104" width="152" height="22" rx="6" />
              <rect x="350" y="236" width="300" height="28" rx="8" />
              <rect x="286" y="398" width="428" height="34" rx="9" />
              <rect x="172" y="642" width="656" height="36" rx="10" />
            </g>
            <g class="svg-stairs">
              <path d="M772 670 L607 246" />
              <path d="M754 622 L624 622 M735 575 L608 575 M716 528 L592 528 M698 481 L576 481 M680 434 L562 434 M662 387 L548 387 M644 340 L536 340 M626 293 L524 293" />
            </g>
            <path class="svg-arch" d="M363 670 C380 540 620 540 637 670" />
            <g class="svg-wheels">
              <circle cx="296" cy="523" r="44" />
              <circle cx="704" cy="430" r="42" />
              <path d="M296 479 L296 567 M252 523 L340 523 M265 492 L327 554 M327 492 L265 554" />
              <path d="M704 388 L704 472 M662 430 L746 430 M674 400 L734 460 M734 400 L674 460" />
            </g>
          </svg>
        </div>

        <div class="vertical-shaft shaft-1">
          <div class="shaft-line"></div>
          <button class="vertical-car" id="verticalCar1" data-elevator="v1" type="button">竖直 1</button>
        </div>
        <div class="vertical-shaft shaft-2">
          <div class="shaft-line"></div>
          <button class="vertical-car blue" id="verticalCar2" data-elevator="v2" type="button">竖直 2</button>
        </div>
        <div class="vertical-shaft shaft-3">
          <div class="shaft-line"></div>
          <button class="vertical-car green" id="verticalCar3" data-elevator="v3" type="button">竖直 3</button>
        </div>
        <div class="vertical-shaft shaft-4">
          <div class="shaft-line"></div>
          <button class="vertical-car violet" id="verticalCar4" data-elevator="v4" type="button">竖直 4</button>
        </div>

        <div class="incline-rail passenger-rail rail-a"><span>双层客梯 A</span></div>
        <div class="incline-rail passenger-rail rail-b"><span>双层客梯 B</span></div>
        <div class="incline-rail cargo-rail rail-c"><span>红色货梯 · 二层餐厅</span></div>
        <div class="incline-rail stairs-rail rail-d"><span>楼梯通道</span></div>

        <button class="inclined-car passenger-car double-deck" id="passengerCarA" data-elevator="p1" type="button">
          <span>上层客舱</span>
          <span>下层客舱</span>
        </button>
        <button class="inclined-car passenger-car double-deck gold" id="passengerCarB" data-elevator="p2" type="button">
          <span>上层客舱</span>
          <span>下层客舱</span>
        </button>
        <button class="inclined-car cargo-car" id="cargoCar" data-elevator="c1" type="button">
          <span>货梯</span>
          <strong>BOX</strong>
        </button>

        <div class="platform-label label-ground">地面入口</div>
        <div class="platform-label label-one">一层平台</div>
        <div class="platform-label label-two">二层平台 · 餐厅</div>
        <div class="platform-label label-three">三层平台 · 换乘竖直电梯</div>
        <div class="platform-label label-four">四层平台</div>
        <div class="platform-label label-top">顶端公寓</div>

        <div class="station station-left">斜柱入口</div>
        <div class="station station-mid">三层换乘</div>
        <div class="station station-right">楼梯角</div>
      </section>

      <section class="control-panel" aria-label="选中电梯控制台">
        <strong id="selectedElevator">当前：双层斜行客梯 A</strong>
        <button id="runToggle" type="button">停下这部</button>
        <button id="reverseElevator" type="button">反向</button>
        <button id="sendLow" type="button">去最低站</button>
        <button id="sendHigh" type="button">去最高站</button>
        <button id="goPlatform1" type="button">一层平台</button>
        <button id="goPlatform2" type="button">二层平台</button>
        <button id="goPlatform3" type="button">三层平台</button>
        <button id="goPlatform4" type="button">四层平台</button>
        <button id="goTopApartment" type="button">顶端公寓</button>
        <button id="slowSpeed" type="button">慢速</button>
        <button id="normalSpeed" class="active" type="button">正常</button>
        <button id="fastSpeed" type="button">快速</button>
        <button id="resetScene" type="button">全部重置</button>
      </section>

      <section class="info-bar" aria-label="电梯运行说明">
        <strong id="statusText">已选中：双层斜行客梯 A。下面控制台正在控制这一部。</strong>
        <p>先点电梯再点平台：黄色客梯走斜柱，红色货梯到二层餐厅，中间竖直电梯负责三层以上。</p>
      </section>
    </main>

    <script src="seven-tower-elevator.js?v=eiffel-platform-big-20260730"></script>
    <script src="arcade-stats.js?v=visitor-table-20260728"></script>
  </body>
</html>
