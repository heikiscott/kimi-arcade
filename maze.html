<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>济州岛迷宫主题乐园</title>
    <link rel="stylesheet" href="maze.css?v=jeju-red-circle-20260814" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="maze-shell">
      <section class="maze-game">
        <canvas id="mazeCanvas" width="960" height="720" aria-label="济州岛迷宫主题乐园游戏"></canvas>
        <div class="win-movie" id="winMovie">
          <p>Jeju Maze Theme Park</p>
          <h1>找到出口了!</h1>
          <span>大家从圆形迷宫出口出来，旁边就是商场和巴士站。</span>
          <button id="movieRestartBtn" type="button">再玩一次</button>
        </div>
      </section>
      <section class="maze-panel">
        <div>
          <p class="label">Jeju 3D Maze Park</p>
          <h2>济州岛迷宫主题乐园</h2>
          <p id="status">从上方入口商场出发，先走方形迷宫，再接到下面圆形迷宫。出口旁边是商场和巴士站。</p>
        </div>
        <div class="player-switch" aria-label="选择键盘控制的人">
          <button class="active" id="selectPlayer1" type="button">键盘控制 1号男生</button>
          <button id="selectPlayer2" type="button">键盘控制 2号女生</button>
        </div>
        <div class="control-board">
          <div class="controller">
            <h3>1号男生</h3>
            <div class="mobile-pad" aria-label="1号男生方向按钮">
              <button data-player="p1" data-move="up" type="button">上</button>
              <button data-player="p1" data-move="left" type="button">左</button>
              <button data-player="p1" data-move="right" type="button">右</button>
              <button data-player="p1" data-move="down" type="button">下</button>
            </div>
          </div>
          <div class="controller">
            <h3>2号女生</h3>
            <div class="mobile-pad" aria-label="2号女生方向按钮">
              <button data-player="p2" data-move="up" type="button">上</button>
              <button data-player="p2" data-move="left" type="button">左</button>
              <button data-player="p2" data-move="right" type="button">右</button>
              <button data-player="p2" data-move="down" type="button">下</button>
            </div>
          </div>
        </div>
        <div class="guest-panel">
          <h3>游客控制盘</h3>
          <p>在画面里点游客，他就会加入队伍。没有点的人会自己在迷宫里走。</p>
          <div id="guestControls" class="guest-controls"></div>
        </div>
        <button id="restartBtn" type="button">重来</button>
      </section>
    </main>
    <script src="maze.js?v=jeju-red-circle-20260814"></script>
    <script src="arcade-stats.js?v=visitor-table-20260728"></script>
  </body>
</html>
