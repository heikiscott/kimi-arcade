<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔法学院密室</title>
    <link rel="stylesheet" href="secret-room.css" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="secret-shell">
      <section class="room-stage">
        <canvas id="roomCanvas" width="960" height="620" aria-label="魔法学院密室控制游戏"></canvas>
        <div class="status-strip" id="statusText">你收到一封会发光的匿名信，故事从魔法学院入口开始。</div>
      </section>

      <section class="control-panel">
        <p class="label">Magic School</p>
        <h1>魔法学院密室</h1>
        <div class="move-pad" aria-label="移动控制">
          <button data-move="up" type="button">上</button>
          <button data-move="left" type="button">左</button>
          <button data-move="down" type="button">下</button>
          <button data-move="right" type="button">右</button>
        </div>
        <div class="action-grid">
          <button data-action="tidy" type="button">整理物品</button>
          <button data-action="search" type="button">调查附近</button>
          <button data-action="advance" type="button">念开门咒</button>
          <button data-action="story" type="button">故事提示</button>
          <button data-action="sound" type="button">古堡声音</button>
          <button data-action="reset" type="button">重来</button>
        </div>
        <p class="hint">键盘：W/A/S/D 或方向键移动，空格/回车调查附近。每间房要先整理，再按故事提示找线索。</p>
      </section>
    </main>
    <script src="secret-room.js"></script>
    <script src="arcade-stats.js?v=account-register-20260728"></script>
  </body>
</html>
