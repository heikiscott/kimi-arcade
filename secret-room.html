<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>隐秘密室</title>
    <link rel="stylesheet" href="secret-room.css" />
  </head>
  <body>
    <a class="home-link" href="arcade.html">游戏大厅</a>
    <main class="secret-shell">
      <section class="room-stage">
        <canvas id="roomCanvas" width="960" height="620" aria-label="隐秘密室控制游戏"></canvas>
        <div class="status-strip" id="statusText">你进入了前面的隐秘密室。用方向键或按钮控制小人。</div>
      </section>

      <section class="control-panel">
        <p class="label">Secret Room</p>
        <h1>隐秘密室</h1>
        <div class="move-pad" aria-label="移动控制">
          <button data-move="up" type="button">上</button>
          <button data-move="left" type="button">左</button>
          <button data-move="down" type="button">下</button>
          <button data-move="right" type="button">右</button>
        </div>
        <div class="action-grid">
          <button data-action="light" type="button">开关灯</button>
          <button data-action="door" type="button">开关门</button>
          <button data-action="chest" type="button">找宝箱</button>
          <button data-action="computer" type="button">开电脑</button>
          <button data-action="dance" type="button">跳舞</button>
          <button data-action="sit" type="button">坐下</button>
          <button data-action="invisible" type="button">隐身</button>
          <button data-action="sleep" type="button">睡觉</button>
          <button data-action="reset" type="button">重来</button>
        </div>
        <p class="hint">键盘：W/A/S/D 或方向键移动。你可以让它在密室里自由活动，想先做什么就点什么。</p>
      </section>
    </main>
    <script src="secret-room.js"></script>
  </body>
</html>
